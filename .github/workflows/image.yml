# Releases: a merge to main publishes the image (latest, and the version in desireerr.py);
# a push to dev publishes the experimental one (dev). Tests have to pass first, and a version
# that's published already can't be published again. A release also gets its tag (v<version>)
# and a GitHub release, its notes the commit subjects since the last one (edit them by hand to taste).
name: image

on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests
        run: python3 -m unittest discover tests
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$GITHUB_REF_NAME" = main ]; then
            version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' desireerr.py)
            if docker manifest inspect "$image:$version" >/dev/null 2>&1; then
              echo "::error::$image:$version is published already: bump VERSION in desireerr.py before merging to main"
              exit 1
            fi
            echo "tags=$image:latest,$image:$version" >>"$GITHUB_OUTPUT"
            echo "version=$version" >>"$GITHUB_OUTPUT"
          else
            echo "tags=$image:dev" >>"$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
      - name: Release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          image: ghcr.io/vibesclauder/desireerr
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          { echo "## Changes"; echo
            git log --no-merges --pretty='- %s' ${previous:+"$previous..HEAD"} | grep -vi '^- Version '
            echo; echo "Images: \`$image:${{ steps.tags.outputs.version }}\` and \`:latest\`."; } >notes.md
          gh release create "v${{ steps.tags.outputs.version }}" --target "$GITHUB_SHA" \
            --title "Desireerr ${{ steps.tags.outputs.version }}" --notes-file notes.md --latest
